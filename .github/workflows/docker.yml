name: Build, Push, and Run Inference Container

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/docker.yml"

jobs:
  build-push-run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Docker Buildx (multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Build the Docker image
      - name: Build Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/my_inference_image:latest
          docker build -t $IMAGE_NAME .

      # 5️⃣ Push the image to Docker Hub
      - name: Push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/my_inference_image:latest
          docker push $IMAGE_NAME

      - name: Run inference container with GCP credentials
        env:
          GCP_SERVICE_ACCOUNT_KEY_B64: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_B64 }}
          GOOGLE_APPLICATION_CREDENTIALS: /app/key.json
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/my_inference_image:latest

          docker run --rm \
            -e GOOGLE_APPLICATION_CREDENTIALS="/app/key.json" \
            -e GCP_SERVICE_ACCOUNT_KEY_B64="$GCP_SERVICE_ACCOUNT_KEY_B64" \
            -w /app \   # Set working directory inside container
            $IMAGE_NAME /bin/bash -c "
              # Decode GCP key inside container
              echo \"\$GCP_SERVICE_ACCOUNT_KEY_B64\" | base64 --decode > /app/key.json

              # Sanity check JSON key
              python3 -m json.tool /app/key.json && echo 'JSON key is valid'

              # Set PYTHONPATH so Python can find src
              export PYTHONPATH=/app

              # Run your main script
              python3 src/main.py