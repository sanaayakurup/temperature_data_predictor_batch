name: Build, Push, and Run Inference Container

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/docker.yml"

jobs:
  build-push-run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Docker Buildx (multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Log in to Docker Hub (use GitHub secrets)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Build the Docker image
      - name: Build Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/my_inference_image:latest
          docker build -t $IMAGE_NAME .

      # 5️⃣ Push the image to Docker Hub
      - name: Push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/my_inference_image:latest
          docker push $IMAGE_NAME

      # 6️⃣ (Optional) Run the container with GCP credentials
      - name: Run inference container with GCP credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /app/key.json
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/my_inference_image:latest

          # Write GCP service account JSON from GitHub Secret to a file
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > key.json

          # Verify key file exists
          echo "Key file created:"
          ls -l key.json

          # Run container with key mounted and env var set
          docker run --rm \
            -v $(pwd)/key.json:/app/key.json \
            -e GOOGLE_APPLICATION_CREDENTIALS="/app/key.json" \
            $IMAGE_NAME

          # Clean up the key after running (good security hygiene)
          rm key.json
