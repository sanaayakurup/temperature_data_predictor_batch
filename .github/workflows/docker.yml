name: Build, Push, and Run Inference Container

on:
  push:
    branches:
      - main
    paths:
      - "inference.py"
      - "Dockerfile"
      - ".github/workflows/docker.yml"

jobs:
  build-push-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build the Docker image
      - name: Build Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/my_inference_image:latest
          docker build -t $IMAGE_NAME .

      # 5. Push the Docker image to Docker Hub
      - name: Push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/my_inference_image:latest
          docker push $IMAGE_NAME

      # 6. Save GCP credentials securely
      - name: Save GCP credentials
        run: |
          mkdir -p /tmp/gcp
          cat <<EOF > /tmp/gcp/key.json
      ${{ secrets.GCP_SA_KEY }}
      EOF

      # 7. Run the Docker container with GCP credentials
      - name: Run inference container
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/my_inference_image:latest
          docker run --rm \
            -e GOOGLE_APPLICATION_CREDENTIALS=/gcp_key.json \
            -v /tmp/gcp/key.json:/gcp_key.json:ro \
            $IMAGE_NAME
